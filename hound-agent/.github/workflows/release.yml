name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@2af22b5b2dcfc0729ee842c635f300f1fc5a9e9a # v5.0.0
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run mypy hound_agent
      - run: uv run pytest --cov=hound_agent --cov-report=term --cov-fail-under=80 -q
      - name: Audit locked production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file audited-requirements.txt
          uv run pip-audit --requirement audited-requirements.txt
      - run: uv build
      - name: Smoke-test wheel
        shell: bash
        run: |
          uv venv release-venv
          uv pip install --python release-venv/bin/python dist/*.whl
          release-venv/bin/hound --version
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          generate_release_notes: true
          files: dist/*
