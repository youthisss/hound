[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hound-agent"
version = "0.2.0"
description = "Hound Agent: all-in-one QA/QC agent that auto-investigates CI/build/test failures, finds root cause, triages, and drafts tickets."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
license-files = ["LICENSE"]
dependencies = [
    "openai",
    "gitpython",
    "pyyaml",
    "textual>=0.86",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
hound = "hound_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hound_agent"]

[tool.hatch.build.targets.sdist]
exclude = ["/demo", "/dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
