# Define this once in the nginx http context.
limit_req_zone $binary_remote_addr zone=hound_per_client:10m rate=30r/m;

server {
    listen 443 ssl;
    server_name hound.internal.example;

    ssl_certificate /etc/nginx/tls/hound.crt;
    ssl_certificate_key /etc/nginx/tls/hound.key;
    client_max_body_size 1m;

    # Deliberately omit Authorization and query strings from access logs.
    log_format hound_safe '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/hound-access.log hound_safe;

    location = /health {
        proxy_pass http://127.0.0.1:8123;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8123;
    }

    location / {
        limit_req zone=hound_per_client burst=10 nodelay;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:8123;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
