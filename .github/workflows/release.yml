name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing X.Y.Z tag to promote (without the leading v)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean
      source_run_id:
        description: Optional prior Release run ID whose retained artifacts should be reused for recovery
        required: false
        default: ""
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --frozen --extra dev
      - name: Verify release identity and reachability
        id: identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]
          expected_prerelease=false
          if [[ "$RELEASE_VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            expected_prerelease=true
          fi
          test "$RELEASE_PRERELEASE" = "$expected_prerelease"
          package_version="$(uv run python -c 'import hound; print(hound.__version__)')"
          test "$RELEASE_VERSION" = "$package_version"
          test "$GITHUB_REF_NAME" = "main"
          git fetch origin main
          test "$(git describe --tags --exact-match HEAD)" = "v${package_version}"
          git merge-base --is-ancestor HEAD origin/main
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: uv run ruff check .
      - run: uv run mypy src/hound
      - run: uv run pytest --cov=hound --cov-report=term --cov-fail-under=80 -q
      - name: Audit locked production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file audited-requirements.txt
          uv run pip-audit --requirement audited-requirements.txt
      - name: Build package artifacts
        if: inputs.source_run_id == ''
        run: uv build
      - name: Verify recovery source run
        if: inputs.source_run_id != ''
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          run_name="$(jq -r '.name' <<<"$run_json")"
          run_path="$(jq -r '.path' <<<"$run_json")"
          run_repository="$(jq -r '.repository.full_name' <<<"$run_json")"
          run_branch="$(jq -r '.head_branch' <<<"$run_json")"
          run_head_repository="$(jq -r '.head_repository.full_name' <<<"$run_json")"
          test "$run_name" = "Release"
          test "$run_path" = ".github/workflows/release.yml"
          test "$run_repository" = "$GITHUB_REPOSITORY"
          test "$run_branch" = "main"
          test "$run_head_repository" = "$GITHUB_REPOSITORY"
          build_conclusion="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name == "build") | .conclusion' | head -n 1)"
          test "$build_conclusion" = "success"
      - name: Download retained distributions for recovery
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: retained/distributions
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Download retained checksums for recovery
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
          path: retained/checksums
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Download retained identity for recovery
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-identity
          path: retained/identity
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Restore retained release artifacts
        if: inputs.source_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(find retained/distributions -maxdepth 1 -type f | wc -l)" -eq 2
          test -f retained/checksums/SHA256SUMS
          test -f retained/identity/release-identity.json
          mkdir -p dist
          cp retained/distributions/* dist/
          cp retained/checksums/SHA256SUMS SHA256SUMS
          cp retained/identity/release-identity.json release-identity.json
      - name: Validate package metadata
        run: uv run twine check dist/*.whl dist/*.tar.gz
      - name: Smoke-test wheel
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/hound-release-smoke"
          mkdir -p "$smoke"
          wheel="$(realpath dist/*.whl)"
          sdist="$(realpath dist/*.tar.gz)"
          uv venv "$smoke/wheel-venv"
          uv pip install --python "$smoke/wheel-venv/bin/python" "$wheel"
          uv venv "$smoke/sdist-venv"
          uv pip install --python "$smoke/sdist-venv/bin/python" "$sdist"
          cd "$smoke"
          wheel-venv/bin/python -c 'import hound'
          wheel-venv/bin/hound --version
          wheel-venv/bin/hound doctor --output-dir wheel-doctor --json
          sdist-venv/bin/python -c 'import hound'
          sdist-venv/bin/hound --version
          sdist-venv/bin/hound doctor --output-dir sdist-doctor --json
          set +e
          wheel-venv/bin/hound analyze --log "$GITHUB_WORKSPACE/tests/fixtures/pytest_fail.log" --output-dir wheel-output --offline
          wheel_status=$?
          sdist-venv/bin/hound analyze --log "$GITHUB_WORKSPACE/tests/fixtures/pytest_fail.log" --output-dir sdist-output --offline
          sdist_status=$?
          set -e
          test "$wheel_status" -eq 1
          test "$sdist_status" -eq 1
          test "$(jq -r .failure.kind wheel-output/report.json)" = "test_failure"
          test "$(jq -r .failure.kind sdist-output/report.json)" = "test_failure"
      - name: Checksums
        if: inputs.source_run_id == ''
        run: sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS
      - name: Record build identity
        if: inputs.source_run_id == ''
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          TAG_COMMIT: ${{ steps.identity.outputs.tag_commit }}
        run: |
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg tag "v$RELEASE_VERSION" \
            --arg commit "$TAG_COMMIT" \
            --arg build_run_id "$GITHUB_RUN_ID" \
            '{version: $version, tag: $tag, commit: $commit, build_run_id: $build_run_id}' \
            > release-identity.json
      - name: Verify artifact identity and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          TAG_COMMIT: ${{ steps.identity.outputs.tag_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          test "$(jq -r .version release-identity.json)" = "$RELEASE_VERSION"
          test "$(jq -r .tag release-identity.json)" = "v$RELEASE_VERSION"
          test "$(jq -r .commit release-identity.json)" = "$TAG_COMMIT"
          if [ -n "$SOURCE_RUN_ID" ]; then
            test "$(jq -r .build_run_id release-identity.json)" = "$SOURCE_RUN_ID"
          else
            test "$(jq -r .build_run_id release-identity.json)" = "$GITHUB_RUN_ID"
          fi
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          sha256sum --strict --check SHA256SUMS
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: SHA256SUMS
          if-no-files-found: error
      - name: Upload release identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-identity
          path: release-identity.json
          if-no-files-found: error

  provenance:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  container-gate:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
      - name: Build runtime and Action images
        run: |
          docker build -t hound:release .
          docker build -f Dockerfile.action -t hound-action:release .
      - name: Smoke-test Action output contract
        shell: bash
        run: |
          mkdir action-smoke
          cp tests/fixtures/pytest_fail.log action-smoke/failure.log
          touch action-smoke/github-output
          set +e
          docker run --rm -w /workspace -e GITHUB_WORKSPACE=/workspace -e GITHUB_OUTPUT=/workspace/github-output \
            -v "$PWD/action-smoke:/workspace" hound-action:release \
            analyze --log failure.log --repo-dir . --output-dir out --offline-value true
          status=$?
          set -e
          test "$status" -eq 1
          test -f action-smoke/out/report.json
          grep -q '^report<<TRACEHOUND_' action-smoke/github-output
          grep -q '^severity<<TRACEHOUND_' action-smoke/github-output
          grep -q '"kind": "test_failure"' action-smoke/out/report.json
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hound:release
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan Action image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hound-action:release
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  windows:
    needs: [build]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "hound-release-wheel"
          uv venv "$smoke\venv"
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          uv pip install --python "$smoke\venv\Scripts\python.exe" $wheel
          Push-Location $smoke
          & "$smoke\venv\Scripts\hound.exe" --version
          & "$smoke\venv\Scripts\hound.exe" doctor --output-dir doctor-output --json
           Pop-Location

  publish-testpypi:
    needs: [build, provenance, container-gate, windows]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hound-tracer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Publish candidate to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  verify-testpypi:
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Verify and smoke-test the published candidate
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          metadata="$(curl --fail --retry 12 --retry-delay 5 "https://test.pypi.org/pypi/hound-tracer/${VERSION}/json")"
          for artifact in dist/*; do
            filename="$(basename "$artifact")"
            published="$(jq -r --arg filename "$filename" '.urls[] | select(.filename == $filename) | .digests.sha256' <<<"$metadata")"
            test -n "$published"
            test "$published" = "$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          done
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_name="$(basename "$wheel")"
          wheel_url="$(jq -r --arg filename "$wheel_name" '.urls[] | select(.filename == $filename) | .url' <<<"$metadata")"
          wheel_hash="$(jq -r --arg filename "$wheel_name" '.urls[] | select(.filename == $filename) | .digests.sha256' <<<"$metadata")"
          test -n "$wheel_url"
          smoke="$RUNNER_TEMP/hound-testpypi-smoke"
          mkdir -p "$smoke"
          curl --fail --location "$wheel_url" --output "$smoke/$wheel_name"
          test "$wheel_hash" = "$(sha256sum "$smoke/$wheel_name" | cut -d ' ' -f 1)"
          uv venv "$smoke/venv"
          uv pip install --python "$smoke/venv/bin/python" "$wheel_url"
          cd "$smoke"
          test "$(venv/bin/hound --version)" = "Hound ${VERSION}"
          venv/bin/hound doctor --output-dir doctor-output --json
          printf 'FAILED tests/test_candidate.py::test_candidate\nAssertionError: expected 1 but got 2\n' > failure.log
          set +e
          venv/bin/hound analyze --log failure.log --output-dir analysis-output --offline
          status=$?
          set -e
          test "$status" -eq 1
          test "$(jq -r .failure.kind analysis-output/report.json)" = "test_failure"

  publish-pypi:
    needs: [build, provenance, container-gate, windows, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hound-tracer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  verify-pypi:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Verify published artifact hashes
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          metadata="$(curl --fail --retry 12 --retry-delay 5 "https://pypi.org/pypi/hound-tracer/${VERSION}/json")"
          for artifact in dist/*; do
            filename="$(basename "$artifact")"
            published="$(jq -r --arg filename "$filename" '.urls[] | select(.filename == $filename) | .digests.sha256' <<<"$metadata")"
            test -n "$published"
            test "$published" = "$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          done

  release:
    needs: [build, provenance, verify-pypi]
    runs-on: ubuntu-latest
    environment:
      name: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dist/*
