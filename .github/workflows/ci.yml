name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@2af22b5b2dcfc0729ee842c635f300f1fc5a9e9a # v5.0.0
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv build
      - run: uv run python -m py_compile hound_agent/*.py hound_agent/analyze/*.py hound_agent/ingest/*.py hound_agent/output/*.py hound_agent/triage/*.py
      - run: docker build -t hound-agent:test .
      - run: docker build -f Dockerfile.action -t hound-agent-action:test .
