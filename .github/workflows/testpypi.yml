name: TestPyPI Candidate

on:
  workflow_dispatch:

concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@2af22b5b2dcfc0729ee842c635f300f1fc5a9e9a # v5.0.0
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src/hound
      - run: uv run pytest --cov=hound --cov-report=term --cov-fail-under=80 -q
      - run: uv build
      - run: uv run twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: testpypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hound
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: testpypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@76f52e6636d8691d1b9ae758667450a41738159e # v1.12.4
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  verify:
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@2af22b5b2dcfc0729ee842c635f300f1fc5a9e9a # v5.0.0
      - name: Install the exact published wheel
        shell: bash
        run: |
          metadata="$(curl --fail --retry 6 --retry-delay 5 https://test.pypi.org/pypi/hound/json)"
          wheel_url="$(jq -r '[.urls[] | select(.packagetype == "bdist_wheel")][0].url' <<<"$metadata")"
          wheel_file="$(jq -r '[.urls[] | select(.packagetype == "bdist_wheel")][0].filename' <<<"$metadata")"
          expected="$(jq -r '[.urls[] | select(.packagetype == "bdist_wheel")][0].digests.sha256' <<<"$metadata")"
          curl --fail --location --output "$wheel_file" "$wheel_url"
          echo "$expected  $wheel_file" | sha256sum --check -
          uv venv candidate-venv
          uv pip install --python candidate-venv/bin/python "$wheel_file"
          candidate-venv/bin/hound --version
          candidate-venv/bin/hound doctor --output-dir doctor-output --json
