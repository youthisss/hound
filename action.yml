name: "Hound Tracer"
description: "Auto-investigate CI/CD failures: root cause -> triage -> ticket draft."
branding:
  icon: "search"
  color: "blue"

inputs:
  log:
    description: "Path to the failure log file"
    required: true
  repo:
    description: "Path to the repository checkout (context)"
    required: false
    default: "${{ github.workspace }}"
  out:
    description: "Output directory"
    required: false
    default: "${{ github.workspace }}/hound-output"
  offline:
    description: "Force rule-based analysis (no LLM)"
    required: false
    default: "true"
  provider:
    description: "Optional OpenAI-compatible provider preset; leave empty to use environment/configuration"
    required: false
    default: ""
  model:
    description: "Optional model override; leave empty to use environment/configuration"
    required: false
    default: ""
  source-context:
    description: "Attach bounded repository source context when trust policy permits"
    required: false
    default: "false"
  context:
    description: "Optional trusted JSON context sidecar path inside the workspace"
    required: false
    default: ""
  enrich:
    description: "Collect bounded read-only deployment evidence when configured"
    required: false
    default: "false"
  redact:
    description: "Keep secret and PII redaction enabled (set false only for controlled local use)"
    required: false
    default: "true"
outputs:
  report:
    description: "Path to the primary RCA JSON report"
  ticket:
    description: "Path to the primary ticket draft"
  severity:
    description: "Primary failure severity"
  kind:
    description: "Primary failure kind"
  stage:
    description: "Primary failure stage"
  dedup_key:
    description: "Primary failure fingerprint"
runs:
  using: "docker"
  image: "Dockerfile.action"
  args:
    - analyze
    - --log
    - ${{ inputs.log }}
    - --repo-dir
    - ${{ inputs.repo }}
    - --output-dir
    - ${{ inputs.out }}
    - --offline-value
    - ${{ inputs.offline }}
    - --provider
    - ${{ inputs.provider }}
    - --model
    - ${{ inputs.model }}
    - --source-context-value
    - ${{ inputs.source-context }}
    - --context
    - ${{ inputs.context }}
    - --enrich-value
    - ${{ inputs.enrich }}
    - --redact-value
    - ${{ inputs.redact }}
